name: CI

on:
  push:
    # The repository's default branch. `main` is kept so a rename does not
    # quietly leave every push unchecked, which is what happened here.
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: health24
          POSTGRES_PASSWORD: health24_ci
          POSTGRES_DB: health24
        ports:
          - 5433:5432
        # The job will not start until Postgres answers, so no sleeping.
        options: >-
          --health-cmd "pg_isready -U health24 -d health24"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Queues for background work, such as scanning uploads.
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      # The application connects as an unprivileged role so that row-level
      # security binds to it. Running the tests as the owner would let every
      # isolation assertion pass against completely broken policies.
      DATABASE_URL: postgresql://health24_api:health24_ci@localhost:5433/health24
      DATABASE_ADMIN_URL: postgresql://health24:health24_ci@localhost:5433/health24
      LOCAL_APP_DB_PASSWORD: health24_ci
      JWT_ACCESS_SECRET: ci_only_secret_not_used_anywhere_else
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      TOTP_ISSUER: Health24
      # Deterministic in CI so a failure is reproducible. Never a real key.
      TOTP_ENCRYPTION_KEY: aGVhbHRoMjQtY2ktb25seS1rZXktbm90LWEtc2VjcmU
      LOG_LEVEL: warn
      REDIS_URL: redis://localhost:6380
      # Document storage and scanning (SP4), started as containers below.
      STORAGE_ENDPOINT: http://localhost:7070
      STORAGE_REGION: ap-south-1
      STORAGE_BUCKET: health24-documents
      STORAGE_ACCESS_KEY_ID: health24_ci
      STORAGE_SECRET_ACCESS_KEY: health24_ci_storage_secret
      CLAMAV_HOST: localhost
      CLAMAV_PORT: 3310

    steps:
      - uses: actions/checkout@v4

      - name: Start document storage and virus scanning
        # Started first, so ClamAV downloads its signatures while dependencies
        # install; the scanning suite waits for it. Not service containers:
        # the storage server needs a command, which services cannot be given.
        run: |
          docker run -d --name storage -p 7070:7070 -v storage_data:/data \
            -e ROOT_ACCESS_KEY_ID=health24_ci -e ROOT_SECRET_ACCESS_KEY=health24_ci_storage_secret \
            -e VGW_REGION=ap-south-1 versity/versitygw:v1.8.0 posix /data
          docker run -d --name clamav -p 3310:3310 clamav/clamav:1.4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        # The API imports @health24/shared from its build output, so this has
        # to happen before anything typechecks.
        run: pnpm --filter @health24/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Create the unprivileged application role
        run: pnpm db:bootstrap

      - name: Portal unit tests
        run: pnpm --filter @health24/portal test

      - name: Clinical app unit tests
        # No database: the offline cache runs against fake-indexeddb.
        run: pnpm --filter @health24/clinical test

      - name: Test
        run: pnpm --filter @health24/api test

      # An untested backup is not a backup (sp7-plan.md, DF7). This dumps the
      # database the suite has just filled, restores it into a scratch copy, and
      # asks the copy whether the record is there and row-level security is
      # still in force — then prints how long each step took, which is what
      # docs/runbooks/restore.md quotes as a recovery time.
      - name: Restore drill
        run: pnpm --filter @health24/api db:restore-drill

      - name: Install Chromium for the browser tests
        run: pnpm --filter @health24/portal exec playwright install --with-deps chromium

      - name: Create the document storage bucket
        # The browser tests ask for a copy of the record and render invoice and
        # discharge PDFs, all of which are written to storage. The API suites
        # make their own bucket.
        run: pnpm --filter @health24/api storage:bootstrap

      - name: Browser tests
        # Builds the API, seeds health24_e2e, and drives the real stack in
        # Chromium: the portal at 360 pixels (sp5-plan.md, T23) and the
        # clinical app's SP6 screens on a desktop (sp6-plan.md, T25).
        run: pnpm test:e2e

      - name: Keep the browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # The traces and screenshots, not the text messages beside them.
          path: |
            apps/portal/playwright-report
            apps/portal/test-results/artifacts
          retention-days: 7

      - name: Build API
        run: pnpm --filter @health24/api build

      - name: Build clinical app
        run: pnpm --filter @health24/clinical build

      - name: Build patient portal
        run: pnpm --filter @health24/portal build

  # ---------------------------------------------------------------------------
  # The images, running (sp7-plan.md, T31)
  # ---------------------------------------------------------------------------
  production-stack:
    name: The production stack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The whole stack from the images that would be deployed: the same
      # Dockerfiles, the same compose order, NODE_ENV=production and every
      # production refusal in force. It is the cheapest place a configuration
      # mistake is found — the API refusing to start here has already caught
      # two (sp7-plan.md, Phase 4).
      - name: Secrets for the local stack
        run: |
          set -euo pipefail
          key() { node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"; }
          sed -e "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(key)|"               -e "s|^TOTP_ENCRYPTION_KEY=.*|TOTP_ENCRYPTION_KEY=$(key)|"               .env.prod-local.example > .env.prod-local

      - name: Bring it up
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)           docker compose -f docker-compose.prod.yml up -d --build

      # Migrations are a job, not something the API does on boot: if it did not
      # finish, nothing below would be meaningful.
      - name: The migration job finished
        run: |
          set -euo pipefail
          code=$(docker inspect -f '{{.State.ExitCode}}' health24-prod-local-migrate-1)
          echo "migrate exited with $code"
          test "$code" = "0"

      - name: Smoke it
        run: node scripts/smoke-prod-stack.mjs

      - name: What it said, if anything went wrong
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail 80

      - name: Stop it
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  # ---------------------------------------------------------------------------
  # What the scanners find (sp7-plan.md, T24, DF8)
  # ---------------------------------------------------------------------------
  scanning:
    name: Dependencies and secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks reads history, not just the tip: a secret removed in a
          # later commit is still in every clone.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The gate: anything high or critical that ships to a patient's browser or
      # runs beside their record fails the build (DF8). Accepted exceptions are
      # written down, with a date, in docs/compliance/accepted-risks.md.
      - name: Production dependencies
        run: pnpm audit --prod --audit-level high

      # Development and build tooling is reported rather than gating. A
      # vulnerability in a test runner is a vulnerability on a developer's
      # machine, and failing every build on one teaches people to ignore the
      # scanner — which is the failure this whole job exists to avoid.
      - name: Development dependencies, for the record
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: Secrets, in the working tree and in history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The images are scanned where they are built (.github/workflows/deploy.yml);
      # this catches what is in the repository itself — a Dockerfile running as
      # root, a Terraform bucket without encryption.
      - name: Infrastructure and Dockerfiles
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: '1'
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

  # ---------------------------------------------------------------------------
  # Migrations are append-only (sp7-plan.md, T21)
  # ---------------------------------------------------------------------------
  migrations:
    name: Migrations are append-only
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base is needed to know which files existed before.
          fetch-depth: 0

      # A migration that has been applied anywhere is history. Editing one means
      # the database somebody already migrated and the file in the repository
      # disagree, and nothing will ever tell them so — the fix for a bad
      # migration is another migration (docs/runbooks/migrations.md).
      - name: No edits to migrations that already existed
        run: |
          set -euo pipefail
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)

          edited=$(git diff --name-only --diff-filter=MD "$base" HEAD -- 'apps/api/drizzle/*.sql' || true)

          if [ -n "$edited" ]; then
            echo "These migrations were changed or removed, and they are history:"
            echo "$edited"
            echo
            echo "Write a new migration instead. See docs/runbooks/migrations.md."
            exit 1
          fi

          echo "No applied migration was edited."

  # ---------------------------------------------------------------------------
  # The infrastructure definitions (sp7-plan.md, T16)
  # ---------------------------------------------------------------------------
  infrastructure:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Formatting
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff

      # No backend and no credentials: this checks that the definitions are
      # valid HCL and that every reference resolves, which is everything that
      # can be known without an account (V1).
      - name: Initialise without a backend
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Validate
        working-directory: infra/terraform
        run: terraform validate

      # A plan needs an account, which CI does not have (V1). What can be
      # checked without one is that every environment names itself, which is
      # the variable the region and the deletion protections hang off.
      - name: Check each environment's variables
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          for file in environments/*.tfvars; do
            grep -qE '^environment[[:space:]]*=' "$file" || {
              echo "$file does not set environment"; exit 1;
            }
            echo "$file names its environment"
          done

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: health24
          POSTGRES_PASSWORD: health24_ci
          POSTGRES_DB: health24
        ports:
          - 5433:5432
        # The job will not start until Postgres answers, so no sleeping.
        options: >-
          --health-cmd "pg_isready -U health24 -d health24"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Queues for background work, such as scanning uploads.
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      # The application connects as an unprivileged role so that row-level
      # security binds to it. Running the tests as the owner would let every
      # isolation assertion pass against completely broken policies.
      DATABASE_URL: postgresql://health24_api:health24_ci@localhost:5433/health24
      DATABASE_ADMIN_URL: postgresql://health24:health24_ci@localhost:5433/health24
      LOCAL_APP_DB_PASSWORD: health24_ci
      JWT_ACCESS_SECRET: ci_only_secret_not_used_anywhere_else
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      TOTP_ISSUER: Health24
      # Deterministic in CI so a failure is reproducible. Never a real key.
      TOTP_ENCRYPTION_KEY: aGVhbHRoMjQtY2ktb25seS1rZXktbm90LWEtc2VjcmU
      LOG_LEVEL: warn
      REDIS_URL: redis://localhost:6380
      # Document storage and scanning (SP4), started as containers below.
      STORAGE_ENDPOINT: http://localhost:7070
      STORAGE_REGION: ap-south-1
      STORAGE_BUCKET: health24-documents
      STORAGE_ACCESS_KEY_ID: health24_ci
      STORAGE_SECRET_ACCESS_KEY: health24_ci_storage_secret
      CLAMAV_HOST: localhost
      CLAMAV_PORT: 3310

    steps:
      - uses: actions/checkout@v4

      - name: Start document storage and virus scanning
        # Started first, so ClamAV downloads its signatures while dependencies
        # install; the scanning suite waits for it. Not service containers:
        # the storage server needs a command, which services cannot be given.
        run: |
          docker run -d --name storage -p 7070:7070 -v storage_data:/data \
            -e ROOT_ACCESS_KEY_ID=health24_ci -e ROOT_SECRET_ACCESS_KEY=health24_ci_storage_secret \
            -e VGW_REGION=ap-south-1 versity/versitygw:v1.8.0 posix /data
          docker run -d --name clamav -p 3310:3310 clamav/clamav:1.4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        # The API imports @health24/shared from its build output, so this has
        # to happen before anything typechecks.
        run: pnpm --filter @health24/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Create the unprivileged application role
        run: pnpm db:bootstrap

      - name: Portal unit tests
        run: pnpm --filter @health24/portal test

      - name: Clinical app unit tests
        # No database: the offline cache runs against fake-indexeddb.
        run: pnpm --filter @health24/clinical test

      - name: Test
        run: pnpm --filter @health24/api test

      - name: Build API
        run: pnpm --filter @health24/api build

      - name: Build clinical app
        run: pnpm --filter @health24/clinical build

      - name: Build patient portal
        run: pnpm --filter @health24/portal build

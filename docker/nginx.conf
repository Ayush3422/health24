# How a built app is served (sp7-plan.md, T14).
#
# Static files and one rewrite, which is all a single-page app needs. What it
# deliberately does not do is proxy `/api`: in a deployment the load balancer
# routes `/api` to the API's own service, so this container never sees a
# clinical request and cannot be tricked into forwarding one.

worker_processes auto;

# Logs to stdout and stderr, because a container's logs belong to whatever is
# collecting them, not to a file nobody rotates.
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # A path can carry a patient's id; no access log is kept of it here. What
  # was read, and by whom, is the audit trail's business (DF5).
  access_log off;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;

  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Writable paths for an unprivileged user, since the image runs as one.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The generated policy, from packages/shared/src/security-headers.ts.
    include /etc/nginx/conf.d/security-headers.conf;

    # The bundler fingerprints its output, so those files never change under a
    # name; the shell that references them must never be cached, or a deploy
    # leaves a browser asking for files that are gone.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      include /etc/nginx/conf.d/security-headers.conf;
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-store" always;
      include /etc/nginx/conf.d/security-headers.conf;
    }

    # The app's own liveness, for the orchestrator.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain always;
      return 200 "ok\n";
    }

    # Any other path is a route inside the app.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

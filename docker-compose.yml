services:
  postgres:
    image: postgres:16-alpine
    container_name: health24-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: health24
      POSTGRES_PASSWORD: health24_local_dev
      POSTGRES_DB: health24
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U health24 -d health24']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: health24-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for documents (SP4). AWS S3 in Mumbai takes
  # its place in production. It checks request signatures as S3 does, so
  # presigned URLs, their expiry and their bound headers are tested for real.
  storage:
    image: versity/versitygw:v1.8.0
    container_name: health24-storage
    restart: unless-stopped
    command: ['posix', '/data']
    environment:
      ROOT_ACCESS_KEY_ID: health24_local
      ROOT_SECRET_ACCESS_KEY: health24_local_storage_secret
      VGW_REGION: ap-south-1
      # Browsers upload straight to storage from the clinical app (SP4).
      VGW_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - '7070:7070'
    volumes:
      - storage_data:/data

  # Virus scanning for uploaded documents (SP4). The first start downloads the
  # signature database, which takes a few minutes; the health check waits for it.
  clamav:
    image: clamav/clamav:1.4
    container_name: health24-clamav
    restart: unless-stopped
    ports:
      - '3310:3310'
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

volumes:
  postgres_data:
  clamav_data:
  storage_data:

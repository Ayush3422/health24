services:
  postgres:
    image: postgres:16-alpine
    container_name: health24-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: health24
      POSTGRES_PASSWORD: health24_local_dev
      POSTGRES_DB: health24
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U health24 -d health24']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: health24-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
